name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esmar
          POSTGRES_PASSWORD: esmar
          POSTGRES_DB: esmar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esmar -d esmar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://esmar:esmar@localhost:5432/esmar?schema=public
      AUTH_SECRET: ci-secret-for-tests-only
      NEXT_PUBLIC_EMPRESA_NOMBRE: Esmar SRL
      E2E_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start app
        run: |
          npm start > /tmp/esmar-app.log 2>&1 &
          for i in {1..40}; do
            curl -sf http://127.0.0.1:3000/api/health && exit 0 || sleep 2
          done
          cat /tmp/esmar-app.log
          exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
